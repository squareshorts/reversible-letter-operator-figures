name: Validate and Build Figures

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv
        run: |
          Rscript -e "if (!requireNamespace('renv', quietly = TRUE)) install.packages('renv')"
          Rscript -e "renv::restore()"

      - name: Validate aggregate inputs
        run: Rscript scripts/validate_inputs.R

      - name: Generate aggregate figures
        run: Rscript scripts/make_all_figures.R

      - name: Verify aggregate outputs
        run: Rscript scripts/verify_outputs.R

      - name: Run tests
        run: Rscript tests/test_all.R

      - name: Parse Cortex restricted-data model script
        run: Rscript -e "parse(file='scripts/cortex_models.R'); cat('cortex_models.R syntax OK\n')"
